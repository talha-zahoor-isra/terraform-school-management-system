<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">AWS architecture of the School Management System</title>
<desc id="d">Internet traffic enters through an Internet Gateway to an EC2 instance running Nginx in a public subnet of a VPC. The instance reads School.html from a private S3 bucket through an IAM role. Terraform provisions everything.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c111d"/><stop offset="1" stop-color="#1a2240"/></linearGradient>
<linearGradient id="vpcfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".10"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".03"/></linearGradient>
<linearGradient id="subfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".12"/><stop offset="1" stop-color="#22c55e" stop-opacity=".03"/></linearGradient>
<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9db7e8"/></linearGradient>
<linearGradient id="s3body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b6e22"/><stop offset=".45" stop-color="#6fb34a"/><stop offset="1" stop-color="#3b6e22"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff9900" stop-opacity=".55"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></radialGradient>
<linearGradient id="oT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffae2e"/></linearGradient><linearGradient id="oL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa31a"/><stop offset="1" stop-color="#d97a00"/></linearGradient><linearGradient id="oR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c26d00"/><stop offset="1" stop-color="#8a4a00"/></linearGradient>
<linearGradient id="pT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a2f5"/><stop offset="1" stop-color="#9a63e0"/></linearGradient><linearGradient id="pL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b4fd6"/><stop offset="1" stop-color="#5a2d99"/></linearGradient><linearGradient id="pR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2d99"/><stop offset="1" stop-color="#3a1b66"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
<path id="pInternet" d="M250,82 L250,318"/>
<path id="pS3" d="M296,386 L722,386"/>
<path id="pTf" d="M744,128 C690,150 660,190 612,224"/>
</defs>
<style>
.f{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.h{fill:#e8eefc;font-weight:700}
.m{fill:#8fa0c4}
.flow{stroke-dasharray:7 9;animation:dash 1.1s linear infinite}
.flowS{stroke-dasharray:7 9;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.float{animation:bob 3.4s ease-in-out infinite}
.float2{animation:bob 3.4s ease-in-out -1.7s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drift{animation:drift 6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.pulse{transform-origin:250px 410px;animation:pulse 2.4s ease-out infinite}
.pulse.b{animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.flowS,.float,.float2,.drift,.pulse{animation:none}}
</style>

<rect width="900" height="530" rx="22" fill="url(#bg)"/>
<g opacity=".06" stroke="#9db7e8">
<line x1="0" y1="0" x2="0" y2="530"/><line x1="45" y1="0" x2="45" y2="530"/><line x1="90" y1="0" x2="90" y2="530"/><line x1="135" y1="0" x2="135" y2="530"/><line x1="180" y1="0" x2="180" y2="530"/><line x1="225" y1="0" x2="225" y2="530"/><line x1="270" y1="0" x2="270" y2="530"/><line x1="315" y1="0" x2="315" y2="530"/><line x1="360" y1="0" x2="360" y2="530"/><line x1="405" y1="0" x2="405" y2="530"/><line x1="450" y1="0" x2="450" y2="530"/><line x1="495" y1="0" x2="495" y2="530"/><line x1="540" y1="0" x2="540" y2="530"/><line x1="585" y1="0" x2="585" y2="530"/><line x1="630" y1="0" x2="630" y2="530"/><line x1="675" y1="0" x2="675" y2="530"/><line x1="720" y1="0" x2="720" y2="530"/><line x1="765" y1="0" x2="765" y2="530"/><line x1="810" y1="0" x2="810" y2="530"/><line x1="855" y1="0" x2="855" y2="530"/><line x1="900" y1="0" x2="900" y2="530"/>
<line x1="0" y1="0" x2="900" y2="0"/><line x1="0" y1="45" x2="900" y2="45"/><line x1="0" y1="90" x2="900" y2="90"/><line x1="0" y1="135" x2="900" y2="135"/><line x1="0" y1="180" x2="900" y2="180"/><line x1="0" y1="225" x2="900" y2="225"/><line x1="0" y1="270" x2="900" y2="270"/><line x1="0" y1="315" x2="900" y2="315"/><line x1="0" y1="360" x2="900" y2="360"/><line x1="0" y1="405" x2="900" y2="405"/><line x1="0" y1="450" x2="900" y2="450"/><line x1="0" y1="495" x2="900" y2="495"/>
</g>

<!-- VPC -->
<rect x="40" y="215" width="600" height="290" rx="20" fill="url(#vpcfill)" stroke="#5b9bff" stroke-width="2" stroke-dasharray="10 7"/>
<text class="f h" x="62" y="240" font-size="15">VPC</text>
<text class="f m" x="104" y="240" font-size="13">10.0.0.0/16</text>

<!-- Subnets -->
<rect x="70" y="255" width="300" height="225" rx="14" fill="url(#subfill)" stroke="#34d399" stroke-opacity=".7" stroke-width="1.5"/>
<text class="f h" x="88" y="278" font-size="13">Public Subnet 1</text>
<text class="f m" x="88" y="296" font-size="12">10.0.1.0/24</text>
<rect x="390" y="255" width="220" height="225" rx="14" fill="url(#subfill)" stroke="#34d399" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="f h" x="408" y="278" font-size="13">Public Subnet 2</text>
<text class="f m" x="408" y="296" font-size="12">10.0.2.0/24</text>

<!-- Flow lines -->
<use xlink:href="#pInternet" href="#pInternet" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" class="flow"/>
<use xlink:href="#pS3" href="#pS3" fill="none" stroke="#ffb84d" stroke-width="3" stroke-linecap="round" class="flowS"/>
<use xlink:href="#pTf" href="#pTf" fill="none" stroke="#b58aeb" stroke-width="3" stroke-linecap="round" class="flow"/>

<!-- Internet cloud -->
<g class="drift">
<g filter="url(#soft)" fill="url(#cloud)">
<ellipse cx="250" cy="52" rx="42" ry="18"/><circle cx="228" cy="44" r="16"/><circle cx="256" cy="38" r="20"/><circle cx="276" cy="48" r="14"/>
</g></g>
<text class="f h" x="312" y="58" font-size="15">Internet</text>

<!-- IGW -->
<g class="float2" filter="url(#shadow)"><polygon points="224,138.0 250,151 250,173 224,160.0" fill="url(#oL)"/><polygon points="250,151 276,138.0 276,160.0 250,173" fill="url(#oR)"/><polygon points="250,125 276,138.0 250,151 224,138.0" fill="url(#oT)"/><polyline points="224,138.0 250,151 276,138.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/></g>
<text class="f h" x="292" y="150" font-size="14">Internet Gateway</text>

<!-- EC2 -->
<ellipse class="pulse" cx="250" cy="410" rx="95" ry="38" fill="none" stroke="#ff9900" stroke-width="2"/>
<ellipse class="pulse b" cx="250" cy="410" rx="95" ry="38" fill="none" stroke="#ff9900" stroke-width="2"/>
<ellipse cx="250" cy="412" rx="80" ry="30" fill="url(#glow)"/>
<g class="float" filter="url(#shadow)"><polygon points="205,340.5 250,363 250,421 205,398.5" fill="url(#oL)"/><polygon points="250,363 295,340.5 295,398.5 250,421" fill="url(#oR)"/><polygon points="250,318 295,340.5 250,363 205,340.5" fill="url(#oT)"/><polyline points="205,340.5 250,363 295,340.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
<rect x="236" y="368" width="28" height="4" rx="2" fill="#fff" fill-opacity=".55"/>
<rect x="236" y="378" width="28" height="4" rx="2" fill="#fff" fill-opacity=".35"/>
</g>
<text class="f h" x="250" y="450" font-size="14" text-anchor="middle">EC2 Instance</text>
<text class="f m" x="250" y="466" font-size="11.5" text-anchor="middle">Amazon Linux 2023</text>

<!-- Nginx card -->
<g filter="url(#soft)">
<rect x="84" y="332" width="108" height="76" rx="12" fill="#1c2744" stroke="#4a5f95"/>
<circle cx="99" cy="346" r="3" fill="#ff5f56"/><circle cx="110" cy="346" r="3" fill="#ffbd2e"/><circle cx="121" cy="346" r="3" fill="#27c93f"/>
<text class="f h" x="138" y="372" font-size="14" text-anchor="middle">Nginx</text>
<text class="f m" x="138" y="388" font-size="11" text-anchor="middle">port 80</text>
<text class="f" x="138" y="402" font-size="11" text-anchor="middle" fill="#7dd3fc">School.html</text>
</g>

<!-- S3 -->
<g class="float2" filter="url(#shadow)">
<rect x="722" y="345" width="96" height="76" fill="url(#s3body)"/>
<ellipse cx="770" cy="421" rx="48" ry="15" fill="#3b6e22"/>
<ellipse cx="770" cy="345" rx="48" ry="15" fill="#a7e07f"/>
<ellipse cx="770" cy="345" rx="48" ry="15" fill="none" stroke="#fff" stroke-opacity=".4"/>
<rect x="758" y="372" width="24" height="18" rx="3" fill="#fff" fill-opacity=".85"/>
<path d="M763,372 v-6 a7,7 0 0 1 14,0 v6" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/>
</g>
<text class="f h" x="770" y="458" font-size="14" text-anchor="middle">Private S3 Bucket</text>
<text class="f m" x="770" y="475" font-size="11.5" text-anchor="middle">School.html</text>
<text class="f m" x="770" y="491" font-size="11.5" text-anchor="middle">public access blocked</text>
<rect x="445" y="352" width="130" height="22" rx="11" fill="#2a1f08" stroke="#ffb84d" stroke-opacity=".8"/>
<text class="f" x="510" y="367" font-size="12" text-anchor="middle" fill="#ffd9a0">IAM role · read-only</text>

<!-- Terraform -->
<g class="float" filter="url(#shadow)"><polygon points="742,89.0 770,103 770,129 742,115.0" fill="url(#pL)"/><polygon points="770,103 798,89.0 798,115.0 770,129" fill="url(#pR)"/><polygon points="770,75 798,89.0 770,103 742,89.0" fill="url(#pT)"/><polyline points="742,89.0 770,103 798,89.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/></g>
<text class="f h" x="770" y="162" font-size="15" text-anchor="middle">Terraform</text>
<text class="f" x="770" y="180" font-size="12" text-anchor="middle" fill="#c9a2f5">terraform apply</text>
<text class="f" x="632" y="168" font-size="12" text-anchor="end" fill="#c9a2f5">provisions</text>

<!-- Security group tag -->
<rect x="150" y="470" width="200" height="0" fill="none"/>

<!-- Packets -->
<circle r="6" fill="#e0f7ff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#pInternet" href="#pInternet"/></animateMotion></circle>
<circle r="6" fill="#e0f7ff"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath xlink:href="#pInternet" href="#pInternet"/></animateMotion></circle>
<circle r="6" fill="#ffe2b0"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#pS3" href="#pS3"/></animateMotion></circle>
<circle r="6" fill="#ffe2b0"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#pS3" href="#pS3"/></animateMotion></circle>
<circle r="6" fill="#e6d2ff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#pTf" href="#pTf"/></animateMotion></circle>
</svg>